<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 280px;
    font-family: -apple-system, "Yu Gothic UI", sans-serif;
    padding: 14px;
    background: #202124;
    color: #eee;
  }
  button {
    width: 100%;
    padding: 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    background: #3ea6ff;
    color: #202124;
    border: none;
    border-radius: 6px;
  }
  button:disabled {
    background: #555;
    color: #aaa;
    cursor: not-allowed;
  }
  #stopBtn {
    background: #e05252;
    color: #fff;
    margin-top: 8px;
  }
  #titlePanelBtn {
    background: #9c6ade;
    color: #fff;
    margin-top: 16px;
  }
  hr {
    border: none;
    border-top: 1px solid #444;
    margin: 14px 0 0;
  }
  #status {
    margin-top: 10px;
    font-size: 12px;
    color: #ccc;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  #progress {
    margin-top: 10px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    color: #3ea6ff;
  }
</style>
</head>
<body>
  <div id="progress"></div>
  <button id="runBtn">ドラフト一括公開設定 開始</button>
  <button id="stopBtn">🛑 停止</button>
  <div id="status">YouTube Studioのコンテンツ画面で押してね</div>
  <hr>
  <button id="titlePanelBtn">✏️ タイトル一括変更パネル</button>
  <script src="popup.js"></script>
</body>
</html>
